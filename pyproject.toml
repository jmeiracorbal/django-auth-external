[project]
name = "django-auth-external"
version = "0.1.0"
description = "JWT token generation and validation for Django"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Jose Meira", email = "jmeiracorbal@gmail.com" }]
keywords = ["django", "jwt", "authentication", "token"]
classifiers = [
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyJWT>=2.8",
    "django>=4.2",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
